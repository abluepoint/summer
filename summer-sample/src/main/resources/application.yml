spring:
  application:
    name: summer-sample
  session:
    data:
      redis:
        namespace: ${SUMMER_SAMPLE_SESSION_NAMESPACE:summer:servlet-session}
  data:
    redis:
      # The endpoint and timeout are runtime-overridable. Credentials are never
      # stored in this file; inject SUMMER_REDIS_USERNAME/PASSWORD at runtime.
      host: ${SUMMER_REDIS_HOST:127.0.0.1}
      port: ${SUMMER_REDIS_PORT:6379}
      timeout: ${SUMMER_REDIS_TIMEOUT:2s}
      connect-timeout: ${SUMMER_REDIS_CONNECT_TIMEOUT:2s}
      username: ${SUMMER_REDIS_USERNAME:}
      password: ${SUMMER_REDIS_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        # Keep JDBC sessions and ORM writes in UTC.
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
      # Preserve Timestamp -> Instant conversion for native SQL DTO projections.
      hibernate.query.native.prefer_jdbc_datetime_types: true
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration/mysql}
    validate-on-migrate: true
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: summer-cluster
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.threadPool.threadCount: 5

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SUMMER_SAMPLE_SESSION_COOKIE_SECURE:false}

summer:
  common:
    enabled: true
  mvc:
    enabled: true
    wrap-responses: true
  sample:
    session-index:
      enabled: ${SUMMER_SAMPLE_SESSION_INDEX_ENABLED:true}
      timeout-ms: ${SUMMER_SAMPLE_SESSION_INDEX_TIMEOUT_MS:500}
      retries: ${SUMMER_SAMPLE_SESSION_INDEX_RETRIES:2}
      failure-threshold: ${SUMMER_SAMPLE_SESSION_INDEX_FAILURE_THRESHOLD:3}
      open-duration-ms: ${SUMMER_SAMPLE_SESSION_INDEX_OPEN_DURATION_MS:5000}
    resilience:
      enabled: ${SUMMER_SAMPLE_RESILIENCE_ENABLED:true}
      timeout: ${SUMMER_SAMPLE_RESILIENCE_TIMEOUT:750ms}
      retry-wait: ${SUMMER_SAMPLE_RESILIENCE_RETRY_WAIT:50ms}
      max-attempts: ${SUMMER_SAMPLE_RESILIENCE_MAX_ATTEMPTS:2}
      rate-limit-period: ${SUMMER_SAMPLE_RESILIENCE_RATE_PERIOD:1s}
      rate-limit: ${SUMMER_SAMPLE_RESILIENCE_RATE_LIMIT:50}
      circuit-open-wait: ${SUMMER_SAMPLE_RESILIENCE_CIRCUIT_OPEN_WAIT:5s}
      circuit-window: ${SUMMER_SAMPLE_RESILIENCE_CIRCUIT_WINDOW:10}
      circuit-failure-rate: ${SUMMER_SAMPLE_RESILIENCE_CIRCUIT_FAILURE_RATE:50}
      bulkhead: ${SUMMER_SAMPLE_RESILIENCE_BULKHEAD:8}
      fallback-ttl: ${SUMMER_SAMPLE_RESILIENCE_FALLBACK_TTL:30s}
    cache:
      ttl: ${SUMMER_SAMPLE_CACHE_TTL:5m}
      node-id: ${SUMMER_SAMPLE_CACHE_NODE_ID:${HOSTNAME:summer-sample}}
    data:
      sql-resource: classpath:sql/customer-queries.sql
    parameter-events:
      scheduling-enabled: true
      poll-interval-ms: 5000
    authorization-events:
      scheduling-enabled: true
      poll-interval-ms: 5000
  data:
    jpa:
      enabled: true
  security:
    enabled: true
    authorization-server:
      enabled: true
      # The browser-visible origin is Summer UI. Spring may still listen on
      # 8080; Vite/Caddy proxy the protocol requests to this internal service.
      issuer: ${SUMMER_SAMPLE_ISSUER:http://127.0.0.1:5173}
      login-page: ${SUMMER_SAMPLE_UI_LOGIN_PAGE:http://127.0.0.1:5173/login}
      user:
        username: ${SUMMER_SAMPLE_BOOTSTRAP_USER:}
        password: ${SUMMER_SAMPLE_BOOTSTRAP_PASSWORD:}
      clients:
        - id: ${SUMMER_SAMPLE_CLIENT_ID:summer-ui}
          public-client: true
          client-authentication-method: none
          grant-types:
            - authorization_code
          redirect-uris:
            - ${SUMMER_SAMPLE_REDIRECT_URI:http://127.0.0.1:5173/oauth2/callback}
          post-logout-redirect-uris:
            - ${SUMMER_SAMPLE_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:5173/login?logout}
          scopes:
            - openid
            - profile
            - customer.read
            - customer.write
    resource-server:
      enabled: true
      protected-paths:
        - /api/**
        - /internal/**
        - /ws/**
    storage:
      oauth-client: jdbc
      authorization: jdbc
      consent: jdbc
      session: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
