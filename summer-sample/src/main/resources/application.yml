spring:
  application:
    name: summer-sample
  datasource:
    url: jdbc:h2:mem:summer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SUMMER_SAMPLE_SESSION_COOKIE_SECURE:false}

summer:
  common:
    enabled: true
  mvc:
    enabled: true
    wrap-responses: true
  sample:
    data:
      sql-resource: classpath:sql/customer-queries.sql
  data:
    jpa:
      enabled: true
  security:
    enabled: true
    authorization-server:
      enabled: true
      issuer: ${SUMMER_SAMPLE_ISSUER:http://127.0.0.1:8080}
      user:
        username: ${SUMMER_SAMPLE_USER:summer-user}
        password: ${SUMMER_SAMPLE_USER_PASSWORD:summer-user-demo-only}
      clients:
        - id: ${SUMMER_SAMPLE_CLIENT_ID:summer-ui}
          public-client: true
          client-authentication-method: none
          grant-types:
            - authorization_code
          redirect-uris:
            - ${SUMMER_SAMPLE_REDIRECT_URI:http://127.0.0.1:5173/oauth2/callback}
          post-logout-redirect-uris:
            - ${SUMMER_SAMPLE_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:5173/login?logout}
          scopes:
            - openid
            - profile
            - customer.read
            - customer.write
    resource-server:
      enabled: true
      protected-paths:
        - /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
